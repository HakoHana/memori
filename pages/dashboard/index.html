<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memori Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .fallback {
    display: none;
    font-family: sans-serif;
    text-align: center;
    padding: 60px 20px;
    background: #f5f5f5;
    color: #333;
  }
  .fallback a { color: #6366f1; }
</style>
</head>
<body>
<iframe id="dashboard-frame" src="http://localhost:8765/"
        allow="clipboard-read; clipboard-write"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
<div class="fallback" id="fallback">
  <h2>Dashboard 无法加载</h2>
  <p style="color:#888;margin-top:16px">
    请直接访问 <a href="http://localhost:8765/" target="_blank">http://localhost:8765/</a>
  </p>
</div>
<script>
  var frame = document.getElementById('dashboard-frame');
  frame.onerror = function() {
    document.getElementById('fallback').style.display = 'block';
    frame.style.display = 'none';
  };
  // 超时检测
  setTimeout(function() {
    try {
      if (frame.contentDocument && frame.contentDocument.body.innerHTML === '') {
        document.getElementById('fallback').style.display = 'block';
        frame.style.display = 'none';
      }
    } catch(e) {
      // 跨域 iframe 无法读取 contentDocument，说明正常加载了
    }
  }, 5000);
</script>
</body>
</html>
